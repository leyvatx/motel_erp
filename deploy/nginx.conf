# Frente HTTP: sirve la interfaz y los archivos, y pasa la API al backend.
#
# TLS termina aquí. El backend redirige a HTTPS cuando DJANGO_DEBUG=False, así
# que servir esto en HTTP pelón deja el navegador dando vueltas. Si pones otro
# proxy adelante que ya termina TLS, cambia $scheme por $http_x_forwarded_proto
# en la línea de X-Forwarded-Proto.

upstream motel_api {
    server api:8000;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # X-Forwarded-For se reescribe, no se acumula: el límite de intentos de
    # acceso y la bitácora leen el primer valor de esa cabecera, y si se
    # concatenara la que manda el cliente cualquiera podría inventarse una IP.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /static/ {
        alias /srv/static/;
        expires 1h;
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
        expires 1h;
        access_log off;
    }

    # Los sockets del tablero de recepción pasan minutos sin tráfico cuando no
    # vence ninguna renta. Con el tiempo de lectura por omisión nginx los
    # cerraría y el grid dejaría de moverse solo.
    location /ws/ {
        proxy_pass http://motel_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://motel_api;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://motel_api;
        proxy_http_version 1.1;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
