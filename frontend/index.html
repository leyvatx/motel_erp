<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Sistema de gestión</title>

    <!--
      El fondo, desde el primer byte.

      La hoja de estilos pesa 68 kB y bloquea el pintado: entre que llega el
      HTML y llega el CSS, el documento no tiene color propio y el navegador
      pinta su blanco. En tema claro no se nota; en tema oscuro es un
      fogonazo blanco a pantalla completa antes de cada carga.

      Estos dos colores son los mismos tokens `--background` de `index.css`
      (claro `0 0% 100%`, oscuro `0 0% 4%`), escritos en hexadecimal porque
      aquí todavía no existen las variables. Si alguna vez cambian allá,
      cambian aquí: es la única duplicación que se paga a cambio de no
      parpadear.
    -->
    <style>
      :root {
        color-scheme: light;
        background-color: #ffffff;
      }
      :root.dark {
        color-scheme: dark;
        background-color: #0a0a0a;
      }
    </style>

    <!--
      Tema antes del primer pintado.

      Sin esto la aplicación arranca en claro -- lo que dice el CSS por defecto
      -- y salta a oscuro cuando React monta y corre el efecto de apariencia.
      En una recarga eso es un destello blanco de pantalla completa, y en un
      turno de noche es lo primero que se nota.

      Lee lo que la sesión anterior dejó ya resuelto (`erp-tema-resuelto`, que
      escribe `applyAppearance`): clase, densidad y variables CSS calculadas.
      No decide nada por su cuenta, así que no puede desincronizarse de la
      lógica de marca blanca; en la primera visita simplemente no hay nada que
      aplicar y se cae al valor por defecto del CSS.
    -->
    <script>
      ;(function () {
        var raiz = document.documentElement

        // Dos cosas distintas, guardadas aparte porque no son de la misma
        // persona. El claro/oscuro es de quien mira -- vale en toda la
        // aplicación, también en la portada, también sin sesión -- y los
        // colores son del negocio, que en la portada pública no pinta nada: ahí
        // un visitante nuevo veía la marca del último motel abierto en este
        // navegador, aunque su sesión ya se hubiera cerrado.
        try {
          var modo = localStorage.getItem('erp-modo')
          if (modo === 'dark') raiz.classList.add('dark')
        } catch (e) {
          /* Almacenamiento bloqueado: arranca en claro, como antes. */
        }

        if (location.pathname === '/') return

        try {
          var crudo = localStorage.getItem('erp-tema-resuelto')
          if (!crudo) return
          var tema = JSON.parse(crudo)
          if (tema.density) raiz.dataset.density = tema.density
          for (var nombre in tema.vars) raiz.style.setProperty(nombre, tema.vars[nombre])
        } catch (e) {
          /* Dato corrupto: arranca con los colores del CSS. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
