services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en api/.env}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en api/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en api/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    env_file: ./api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=5)
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s

  worker:
    build: ./api
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    command: ["celery", "-A", "core", "worker", "-Q", "celery", "-l", "info"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_files:/app/media

  printer:
    build: ./api
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    command: ["celery", "-A", "core", "worker", "-Q", "printing", "-c", "2", "-l", "info"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./api
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    command: ["celery", "-A", "core", "beat", "-l", "info"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CERT_DOMAIN: ${CERT_DOMAIN:?falta CERT_DOMAIN en api/.env}
      NGINX_ENVSUBST_FILTER: CERT_
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/bootstrap-cert.sh:/usr/local/bin/bootstrap-cert.sh:ro
      - ./deploy/certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro
    command:
      - /bin/sh
      - -c
      - |
        sh /usr/local/bin/bootstrap-cert.sh
        while :; do sleep 6h & wait $${!}; nginx -s reload; done &
        exec nginx -g 'daemon off;'

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - ./deploy/certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 12h & wait $${!}
        done

  certbot-init:
    image: certbot/certbot:latest
    profiles: ["init"]
    environment:
      CERT_DOMAIN: ${CERT_DOMAIN:?falta CERT_DOMAIN en api/.env}
      CERT_EMAIL: ${CERT_EMAIL:?falta CERT_EMAIL en api/.env}
    volumes:
      - ./deploy/certs:/etc/letsencrypt
      - ./deploy/issue-cert.sh:/usr/local/bin/issue-cert.sh:ro
      - certbot_webroot:/var/www/certbot
    entrypoint: ["/bin/sh", "/usr/local/bin/issue-cert.sh"]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en api/.env}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  backups:
  certbot_webroot:
