# Despliegue de producción. Se arranca leyendo la configuración de api/.env:
#
#   docker compose --env-file api/.env -f docker-compose.prod.yml up -d --build
#
# Ese archivo es la única fuente de verdad: de ahí salen tanto las variables de
# Django como la contraseña de PostgreSQL. Si falta, compose se niega a
# arrancar en vez de levantar la base con una contraseña vacía.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en api/.env}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en api/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en api/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    env_file: ./api/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media

  worker:
    build: ./api
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    command: ["celery", "-A", "core", "worker", "-l", "info"]
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - media_files:/app/media

  beat:
    build: ./api
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    command: ["celery", "-A", "core", "beat", "-l", "info"]
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en api/.env}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  backups:
