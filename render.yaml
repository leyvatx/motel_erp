envVarGroups:
  - name: motel-erp-comun
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: CELERY_RESULT_BACKEND
        value: django-db
      - key: BUSINESS_TIME_ZONE
        value: America/Tijuana
      - key: BUSINESS_CURRENCY
        value: MXN
      - key: BUSINESS_NAME
        value: Motel Demo
      - key: EXPIRATION_WARNING_MINUTES
        value: "15"
      - key: EXPENSE_APPROVAL_THRESHOLD
        value: "1000.00"
      - key: PRINTER_BACKEND
        value: dummy
      - key: PRINT_TICKET_ON_FOLIO_CLOSE
        value: "False"

databases:
  - name: motel-erp-db
    databaseName: motel_erp
    user: motel
    plan: free

services:
  - type: redis
    name: motel-erp-redis
    plan: free
    ipAllowList: []

  - type: web
    name: motel-erp-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /api/v1/health/
    envVars:
      - fromGroup: motel-erp-comun
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: motel-erp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: motel-erp-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: motel-erp-redis
          property: connectionString
      - key: CACHE_URL
        fromService:
          type: redis
          name: motel-erp-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: PLATFORM_ADMIN_USERNAME
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false

  - type: web
    name: motel-erp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
