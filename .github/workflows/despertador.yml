name: Despertador

# Mantiene despierto el plan free de Render, que duerme a los 15 min sin
# tráfico. Si algún día pagas plan starter, borra este archivo.
#
# OJO: GitHub solo activa `schedule` desde la rama por omisión del repo. En una
# rama de trabajo este archivo existe pero no dispara nada.

on:
  schedule:
    # MEDIDO EL 2026-09-07, SOBRE LAS 72 CORRIDAS DE LOS 11 DÍAS ANTERIORES:
    # este cron pide cada 10 min y GitHub lo entrega cada 210 min de mediana.
    # El intervalo más corto de las 72 fue de 93 min y el más largo de 738.
    # Ninguno bajó de los 15 min que dura la ventana de Render, así que este
    # workflow no ha evitado una sola dormida: solo la acorta cuando cae.
    #
    # No se arregla bajando el número -- GitHub descarta antes los crones más
    # seguidos -- ni agregando un segundo workflow igual, que se encola con el
    # mismo criterio. Lo que sí despierta a tiempo:
    #   * scripts/keep_alive.ps1, mientras haya una máquina encendida;
    #   * un servicio de monitoreo externo (UptimeRobot, cron-job.org), que sí
    #     cumple el intervalo pero hay que dar de alta a mano;
    #   * el plan starter de Render, que no duerme.
    #
    # Se queda porque despertar cada tres horas es mejor que nada y no cuesta:
    # el repo es público y los minutos de Actions no se cobran.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  # Si un ping se quedó esperando a que arranque el contenedor, el siguiente no
  # tiene nada que aportar.
  group: despertador
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar la API
        run: |
          # /api/health es la sonda barata: no toca base ni Redis, así que un
          # hipo de Redis no manda un correo de fallo que no es de dormirse.
          # --fail convierte cualquier 4xx/5xx en salida distinta de cero.
          curl -sS --fail --max-time 180 \
            --retry 5 --retry-delay 20 --retry-all-errors \
            -o /dev/null -w 'http=%{http_code} total=%{time_total}s\n' \
            https://motel-erp-api.onrender.com/api/health

      - name: Avisar que la API no contesta
        if: failure()
        run: |
          echo "::error title=La API no despertó::Cinco intentos en tres minutos" \
               "contra /api/health y ninguno pasó. No es el sueño normal del plan" \
               "free: eso lo cubre el reintento. Revisa el panel de Render."
          # El job ya viene fallando; esto solo le pone nombre en la interfaz.
          # GitHub avisa por correo al dueño del repo cuando un workflow
          # programado falla, así que no hace falta cablear nada más.
          exit 1
