name: Despertador

# ponytail: mantiene despierto el plan free de Render, que duerme a los 15 min.
# Si algún día pagas plan starter, borra este archivo.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar la API
        run: |
          curl -sS --fail --max-time 180 --retry 3 --retry-delay 30 --retry-all-errors \
            -o /dev/null -w 'http=%{http_code} total=%{time_total}s\n' \
            https://motel-erp-api.onrender.com/api/v1/health/
